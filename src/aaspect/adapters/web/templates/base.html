<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AASpect{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="appbar">
    <a class="brand" href="/">AASpect</a>
    <span class="tagline">Analysis of Asset Administration Shell corpora</span>
    <nav class="appnav">
      <a href="/">New analysis</a>
      <button type="button" id="theme-switch" class="theme-switch" hidden>Dark mode</button>
    </nav>
  </header>
  <main class="{% block layout %}single{% endblock %}">
{% block content %}{% endblock %}
  </main>
</body>
</html>
