[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aaspect"
version = "0.1.0"
description = "Analysis tool for corpora of Asset Administration Shells, based on neo4aas."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[dependency-groups]
dev = [
  "coverage", # Measures test coverage and enforces minimum coverage in CI.
  "pyright",  # Static type checker for Python.
  "ruff",     # Formatter, linter, and import sorter.
]

[tool.coverage.run]
branch = true              # Track branch coverage, not just line coverage.
source = ["aaspect"]       # Measure coverage for the package only.

[tool.coverage.report]
show_missing = true        # Show missing line numbers in the coverage report.
skip_covered = true        # Hide files with complete coverage from the report.
fail_under = 80            # Fail if total coverage is below this percentage.

[tool.ruff]
line-length = 100          # Maximum line length for formatting and linting.

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # import sorting
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
]

[tool.pyright]
include = ["src", "tests"]     # Type-check package and tests.
typeCheckingMode = "standard"  # Balanced default; stricter than basic, less strict than strict.
